[package]
name = "grin_p2p"
version = "5.5.2"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Chain implementation for grin, a simple, private and scalable cryptocurrency implementation based on the Mimblewimble chain format."
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin"
keywords = [ "crypto", "grin", "mimblewimble" ]
edition = "2021"
build = "src/build/build.rs"

[dependencies]
bitflags = "1"
enum_primitive = "0.1"
lru-cache = "0.1"
num = "0.2"
rand = "0.6"
serde = "1"
serde_derive = "1"
tempfile = "3.1"
log = "0.4"
chrono = { version = "0.4.11", features = ["serde"] }
bytes = "1"

# Tor related deps
arti-client = { version = "0.48.0", features = ["pt-client", "onion-service-service", "onion-service-client"], optional = true }
tor-rtcompat = { version = "0.48.0", optional = true }
fs-mistrust = { version = "0.16.1", optional = true }
fslock-guard = { version = "0.8", optional = true }
tor-hsservice = { version = "0.48.0", optional = true }
tor-hsrproxy = { version = "0.48.0", optional = true }
tor-keymgr = { version = "0.48.0", optional = true }
tor-llcrypto = { version = "0.48.0", optional = true }
tor-hscrypto = { version = "0.48.0", optional = true }
sha2 = { version = "0.10.8", optional = true }
hyper = { version = "1.10.1", features = ["http1", "client"], optional = true }
hyper-util = { version = "0.1.20", features = ["tokio", "http1", "client-legacy"], optional = true }
hyper-socks2 = { version = "0.9.1", features = ["tls"], optional = true }
tower-service = { version = "0.3", optional = true }
hyper-proxy2 = { version = "0.1", optional = true }
hyper-tls = { version = "0.6.0", optional = true }
http-body-util = { version = "0.1.3", optional = true }
ed25519-dalek = { version = "2", features = ["hazmat", "digest"], optional = true }
regex = { version = "1.12.4", optional = true }
sysinfo = { version = "0.29", optional = true }
thiserror = { version = "2", optional = true }
data-encoding = { version = "2", optional = true }
sha3 = { version = "0.8", optional = true }
base64 = { version = "0.12.0", optional = true }
url = { version = "2.1", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1.52.3", features = ["full"], optional = true }
tracing = { version = "0.1", features = ["log"], optional = true }
async-trait = { version = "0.1.92", optional = true }
serde_json = "1"

grin_core = { path = "../core", version = "5.5.2" }
grin_store = { path = "../store", version = "5.5.2" }
grin_util = { path = "../util", version = "5.5.2" }
grin_chain = { path = "../chain", version = "5.5.2" }

[build-dependencies]
built = { version = "0.8.0", features = ["git2"]}

[features]
tor = [
    "arti-client",
    "tor-rtcompat",
    "fs-mistrust",
    "fslock-guard",
    "tor-hsservice",
    "tor-hsrproxy",
    "tor-keymgr",
    "tor-llcrypto",
    "tor-hscrypto",
    "sha2",
    "hyper",
    "hyper-util",
    "hyper-socks2",
    "hyper-tls",
    "hyper-proxy2",
    "tower-service",
    "http-body-util",
    "ed25519-dalek",
    "regex",
    "sysinfo",
    "thiserror",
    "data-encoding",
    "sha3",
    "base64",
    "url",
    "futures",
    "tokio",
    "tracing",
    "async-trait",
]
tor-static = ["tor", "arti-client/static"]
