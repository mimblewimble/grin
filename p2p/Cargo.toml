[package]
name = "grin_p2p"
version = "5.5.2"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Chain implementation for grin, a simple, private and scalable cryptocurrency implementation based on the Mimblewimble chain format."
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin"
keywords = [ "crypto", "grin", "mimblewimble" ]
edition = "2021"
build = "src/build/build.rs"

[dependencies]
bitflags = "1"
enum_primitive = "0.1"
lru-cache = "0.1"
num = "0.2"
rand = "0.6"
serde = "1"
serde_derive = "1"
tempfile = "3.1"
log = "0.4"
chrono = { version = "0.4.11", features = ["serde"] }
bytes = "1"
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3"
serde_json = "1"

arti-client = { version = "0.43.0", features = ["static", "pt-client", "onion-service-service", "onion-service-client"] }
tor-rtcompat = { version = "0.43.0", features = ["static"] }
fs-mistrust = "0.14.2"
fslock-guard = "0.8"
tor-hsservice = "0.43.0"
tor-hsrproxy = "0.43.0"
tor-keymgr = "0.43.0"
tor-llcrypto = "0.43.0"
tor-hscrypto = "0.43.0"
sha2 = "0.10.8"
hyper = { version = "1.10.1", features = ["http1", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
ed25519-dalek = "2"
regex = "1.12.4"
sysinfo = "0.29"
timer = "0.2"
thiserror = "2"
data-encoding = "2"
sha3 = "0.8"
lazy_static = "1.5.0"
base64 = "0.12.0"
url = "2.1"

grin_core = { path = "../core", version = "5.5.2" }
grin_store = { path = "../store", version = "5.5.2" }
grin_util = { path = "../util", version = "5.5.2" }
grin_chain = { path = "../chain", version = "5.5.2" }

[build-dependencies]
built = { version = "0.8.0", features = ["git2"]}
