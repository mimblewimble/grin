[package]
name = "grin_tor"
version = "5.5.2"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Shared Tor transport and onion services for Grin applications."
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin"
edition = "2021"
publish = false

[workspace]
resolver = "2"
exclude = ["arti"]

[dependencies]
arti-client = { path = "arti/crates/arti-client", version = "0.48.0", features = ["pt-client", "onion-service-service", "onion-service-client"] }
tor-rtcompat = { path = "arti/crates/tor-rtcompat", version = "0.48.0" }
fs-mistrust = { path = "arti/crates/fs-mistrust", version = "0.16.1" }
fslock-guard = { version = "0.8" }
tor-hsservice = { path = "arti/crates/tor-hsservice", version = "0.48.0" }
tor-hsrproxy = { path = "arti/crates/tor-hsrproxy", version = "0.48.0" }
tor-keymgr = { path = "arti/crates/tor-keymgr", version = "0.48.0" }
tor-llcrypto = { path = "arti/crates/tor-llcrypto", version = "0.48.0" }
tor-hscrypto = { path = "arti/crates/tor-hscrypto", version = "0.48.0" }
sha2 = { version = "0.10.8" }
hyper = { version = "1.10.1", features = ["http1", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "http1", "client-legacy"] }
hyper-socks2 = { version = "0.9.1", features = ["tls"] }
tower-service = { version = "0.3" }
hyper-proxy2 = { version = "0.1" }
hyper-tls = { version = "0.6.0" }
http-body-util = { version = "0.1.3" }
ed25519-dalek = { version = "2", features = ["hazmat", "digest"] }
regex = { version = "1.12.4" }
sysinfo = { version = "0.29" }
thiserror = { version = "2" }
data-encoding = { version = "2" }
sha3 = { version = "0.8" }
base64 = { version = "0.12.0" }
url = { version = "2.1" }
futures = { version = "0.3" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
async-trait = { version = "0.1.92" }
serde_json = "1"

grin_util = { path = "../util", version = "5.5.2" }
log = "0.4"
rand = "0.6"
serde = { version = "1", features = ["derive"] }
tempfile = "3.1"

[features]
tor-static = ["arti-client/static"]
